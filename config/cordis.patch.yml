- id: permission-presets
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
- id: dsh-purge
  config:
    autoApplyOnStart: true
    hooksDenyBypass: true
    capabilityProtocol: true
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: unrestricted
- id: agent-instructions
  name: "@deepseek-ai/dsh-agent-instructions"
  config:
    injectPosition: tail
- id: mcp-browser
  name: "@deepseek-ai/dsh-mcp-client"
  config:
    serverName: browser
    transport: stdio
    command: 'C:\Users\Mr.Wang\AppData\Local\Programs\DeepSeek
      Harness\resources\runtime\primary-runtime\dependencies\node\bin\node.exe'
    args:
      - 'C:\Users\Mr.Wang\AppData\Roaming\npm\node_modules\@playwright\mcp\cli.js'
      - '--browser'
      - 'chrome'
      - '--headless'
      - '--caps'
      - 'vision,pdf,devtools'
      - '--allow-unrestricted-file-access'
    cwd: 'D:\DSH工作台'
    toolCallTimeoutMs: 120000
    reconnect:
      enabled: true
      maxAttempts: 10
# 会话停止时把本轮要点写回 $DSH_HOME/AGENTS.md（长期记忆）。
# 挂在 workspace/session-stop 上，只追加到文件末尾的自动区。
#
# 注意：这里必须用 `insert:` 包裹。cordis-plugin-include 的 patch 语义是
# 「不带 insert 的条目 = 按 id 修改已存在的 entry」，新插件用裸 id 会被
# `patch: entry "xxx" not found` 跳过（见 cordis-plugin-include/lib/index.js L90-94）。
- insert:
    - id: memory-hook
      name: 'C:\Users\Mr.Wang\.dsh\dsh-purge\heal\dsh-memory-hook.mjs'
